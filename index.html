<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Placement Portal | MGIT</title>

<!-- CSV Parsing Library -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* ===== GLOBAL RESET & FULL-VIEWPORT LOCK ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100vh;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    background-color: #ffffff;
    color: #0f172a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ===== REQUIREMENT 2: MULTICOLORED CURSOR FOCUS LIGHT ===== */
#cursor-light {
    position: fixed;
    top: 0;
    left: 0;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 0, 128, 0.3) 0%,
        rgba(0, 212, 255, 0.25) 35%,
        rgba(255, 215, 0, 0.2) 65%,
        transparent 100%
    );
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    mix-blend-mode: multiply;
    display: none;
    transition: transform 0.02s ease-out;
}

/* ===== TOP CONTROLS WRAPPER ===== */
.top-controls {
    flex-shrink: 0;
    width: 100%;
    background: #ffffff;
    z-index: 10;
    margin: 0;
    padding: 0;
}

/* ===== CENTERED HEADER ===== */
.header {
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #091e42 0%, #0f2b5c 50%, #16387c 100%);
    border-bottom: 3px solid #ffca28;
    position: relative;
    text-align: center;
    margin: 0;
}

.header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
}

.header h1 {
    color: #ffffff;
    font-size: 21px;
    text-transform: none;
    letter-spacing: 0.3px;
    font-weight: 700;
    margin: 0;
}

.header h2 {
    font-size: 14px;
    color: #ffca28;
    font-weight: 600;
    text-transform: none;
    margin-top: 3px;
}

.header h3 {
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 400;
    text-transform: none;
    margin-top: 2px;
}

.cgpa-btn {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    padding: 9px 18px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #ff8f00 0%, #ffca28 100%);
    color: #091e42;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: none;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    transition: all 0.2s ease;
}

.cgpa-btn:hover {
    background: linear-gradient(135deg, #ffa000 0%, #ffd54f 100%);
}

/* ===== MAIN SECTION WRAPPER ===== */
.main-wrapper {
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
}

/* ===== METRIC CARDS & CGPA RANGE BOX ===== */
.cards-container {
    width: 100%;
    display: grid;
    /* Requirement 1: 6 columns to include CGPA Filter Box on the left */
    grid-template-columns: 1.2fr repeat(5, 1fr);
    gap: 0;
    margin: 0;
    padding: 0;
}

.card {
    padding: 8px 10px;
    border-radius: 0;
    color: white;
    min-height: 58px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    position: relative;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
}

.card:last-child {
    border-right: none;
}

/* Requirement 1: CGPA Range Filter Box Style */
.cgpa-filter-card {
    background: linear-gradient(135deg, #0b192c 0%, #1e293b 100%);
    border-left: 4px solid #ffca28;
}

.cgpa-filter-card h3 {
    color: #ffca28;
    margin-bottom: 3px;
}

.cgpa-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 2px;
}

.cgpa-inputs input {
    width: 45%;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid #ffca28;
    background: #ffffff;
    color: #0f172a;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    outline: none;
}

.cgpa-inputs input:focus {
    border-color: #00e676;
    box-shadow: 0 0 5px rgba(0, 230, 118, 0.6);
}

.cgpa-inputs span {
    color: #ffffff;
    font-weight: 700;
    font-size: 12px;
}

.card:nth-child(2) { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
.card:nth-child(3) { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
.card:nth-child(4) { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); }
.card:nth-child(5) { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); }
.card:nth-child(6) { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }

.card h3 {
    margin: 0;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
    text-transform: none;
}

.card p {
    margin-top: 2px;
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
}

/* ===== FILTER TOOLBAR ===== */
.filter-container {
    width: 100%;
    display: grid;
    grid-template-columns: 1.5fr repeat(6, 1fr);
    gap: 6px;
    background: #0f172a;
    padding: 8px 10px;
    border-radius: 0;
    border: none;
    margin: 0;
}

.filter-container input,
.filter-container select {
    width: 100%;
    padding: 7px 10px;
    border-radius: 4px;
    border: 1px solid #334155;
    background: #ffffff;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #1e293b;
    outline: none;
}

.filter-container input:focus,
.filter-container select:focus {
    border-color: #ff6600;
}

/* ===== TABLE CONTAINER ===== */
.table-container {
    flex-grow: 1;
    width: 100%;
    overflow-x: auto !important;
    overflow-y: auto !important;
    padding: 0;
    margin: 0;
    background: #ffffff;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: #ffffff;
    border-radius: 0;
    border: none;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
}

th {
    background: #1e293b;
    color: #ffffff;
    padding: 10px 14px;
    text-align: center;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 2;
    font-size: 12px;
    font-weight: 700;
    text-transform: none;
    border-bottom: 2px solid #0f172a;
    border-right: 1px solid #334155;
}

th:last-child {
    border-right: none;
}

td {
    padding: 8px 14px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid #e2e8f0;
    border-right: 1px solid #f1f5f9;
    font-size: 12px;
    color: #334155;
    font-weight: 500;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    transition: all 0.15s ease;
}

td:last-child {
    border-right: none;
}

tr:nth-child(even) td {
    background: #f8fafc;
}

/* Requirement 2: Multicolored Focus Light Hover Effect on Active Row Movement */
tr:hover td {
    background: linear-gradient(90deg, rgba(255, 99, 132, 0.2) 0%, rgba(54, 162, 235, 0.2) 50%, rgba(255, 206, 86, 0.25) 100%);
    color: #000000;
    font-weight: 700;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 15px;
    font-weight: 600;
    color: #1e293b;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
}

/* ===== REQUIREMENT 3: SOLID ORANGE HORIZONTAL SCROLLBAR ===== */
.table-container::-webkit-scrollbar {
    height: 14px; /* Visible height at the end of the screen */
    width: 10px;
}

.table-container::-webkit-scrollbar-track {
    background: #fff0e6;
    border-top: 1px solid #ffd6cc;
}

.table-container::-webkit-scrollbar-thumb {
    background: #ff6600; /* Solid Vibrant Orange */
    border-radius: 4px;
    border: 2px solid #fff0e6;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: #e65c00; /* Deep Solid Orange on Hover */
}
</style>
</head>

<body>

<!-- Multicolored Cursor Focus Light Container -->
<div id="cursor-light"></div>

<div class="top-controls">

    <!-- CENTERED HEADER -->
    <div class="header">
        <div class="header-brand">
            <h1>Mahatma Gandhi Institute of Technology</h1>
            <h2>Training & Placement Cell</h2>
            <h3>Academic Year 2026 - 2027</h3>
        </div>
        <button class="cgpa-btn" onclick="goToCGPAAnalysis()">CGPA Analysis</button>
    </div>

    <div class="main-wrapper">
        <!-- METRIC CARDS SECTION WITH CGPA RANGE FILTER BOX -->
        <div class="cards-container">
            
            <!-- Requirement 1: CGPA Range Box on the Left of Total Students Card -->
            <div class="card cgpa-filter-card">
                <h3>CGPA Range Filter</h3>
                <div class="cgpa-inputs">
                    <input type="number" id="minCgpa" placeholder="Min" step="0.1" min="0" max="10">
                    <span>-</span>
                    <input type="number" id="maxCgpa" placeholder="Max" step="0.1" min="0" max="10">
                </div>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>
            <div class="card">
                <h3>Registered for Placements</h3>
                <p id="registeredStudents">0</p>
            </div>
            <div class="card">
                <h3>Eligible Students</h3>
                <p id="eligibleStudents">0</p>
            </div>
            <div class="card">
                <h3>Total Students Placed</h3>
                <p id="placedStudents">0</p>
            </div>
            <div class="card">
                <h3>Total Offers</h3>
                <p id="totalOffers">0</p>
            </div>
        </div>

        <!-- FILTER TOOLBAR SECTION -->
        <div class="filter-container">
            <input type="text" id="searchInput" placeholder="Search any student data...">
            <select id="branchFilter"><option value="">Branch</option></select>
            <select id="backlogFilter"><option value="">No. of Backlogs</option></select>
            <select id="genderFilter"><option value="">Gender</option></select>
            <select id="dsaFilter"><option value="">DSA Training</option></select>
            <select id="registeredFilter"><option value="">Registered for Placements</option></select>
            <select id="offersFilter"><option value="">No. of Offers</option></select>
        </div>
    </div>

</div>

<!-- DATA TABLE SECTION -->
<div class="table-container">
    <div class="loading" id="loading">Loading Student Placement Data...</div>
    <table id="dataTable"></table>
</div>

<script>
/* REQUIREMENT 2: MULTICOLORED FOCUS LIGHT CURSOR MOVEMENT LOGIC */
const cursorLight = document.getElementById("cursor-light");
document.addEventListener("mousemove", (e) => {
    cursorLight.style.display = "block";
    cursorLight.style.left = e.clientX + "px";
    cursorLight.style.top = e.clientY + "px";
});

document.addEventListener("mouseleave", () => {
    cursorLight.style.display = "none";
});

const csvURL = localStorage.getItem("csvURL");

let originalData = [];
let headers = [];

Papa.parse(csvURL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
        if (!results.data || results.data.length === 0) {
            document.getElementById("loading").innerText = "Error: No data found in CSV.";
            return;
        }

        headers = results.data[0];
        originalData = results.data.slice(1);

        populateFilters(originalData);
        applyFilters();

        document.getElementById("loading").style.display = "none";
    },
    error: function(err) {
        document.getElementById("loading").innerText = "Error loading CSV file.";
        console.error(err);
    }
});

/* FILTER ELEMENTS */
const searchInput = document.getElementById("searchInput");
const branchFilter = document.getElementById("branchFilter");
const backlogFilter = document.getElementById("backlogFilter");
const genderFilter = document.getElementById("genderFilter");
const dsaFilter = document.getElementById("dsaFilter");
const registeredFilter = document.getElementById("registeredFilter");
const offersFilter = document.getElementById("offersFilter");
const minCgpaInput = document.getElementById("minCgpa");
const maxCgpaInput = document.getElementById("maxCgpa");

/* EVENT LISTENERS */
searchInput.addEventListener("input", applyFilters);
branchFilter.addEventListener("change", applyFilters);
backlogFilter.addEventListener("change", applyFilters);
genderFilter.addEventListener("change", applyFilters);
dsaFilter.addEventListener("change", applyFilters);
registeredFilter.addEventListener("change", applyFilters);
offersFilter.addEventListener("change", applyFilters);
minCgpaInput.addEventListener("input", applyFilters);
maxCgpaInput.addEventListener("input", applyFilters);

/* POPULATE DROPDOWNS */
function populateFilters(data){
    fillFilter(branchFilter, "Branch", data);
    fillFilter(backlogFilter, "No. of Backlogs", data);
    fillFilter(genderFilter, "Gender", data);
    fillFilter(dsaFilter, "DSA", data);
    fillFilter(registeredFilter, "Registered for Placements", data);
    fillFilter(offersFilter, "No. of Offers", data);
}

function fillFilter(filter, column, data){
    let index = headers.indexOf(column);
    if (index === -1) {
        index = headers.findIndex(h => h.toUpperCase().includes(column.toUpperCase()));
    }
    
    if(index === -1) {
        filter.innerHTML = `<option value="">${column} (N/A)</option>`;
        return; 
    }

    let values = [...new Set(data.map(row => row[index]))];
    values = values.filter(v => v !== undefined && v !== null && String(v).trim() !== "");

    const displayTitle = column === "DSA" ? "DSA Training" : column;
    filter.innerHTML = `<option value="">${displayTitle}</option>`;

    values.sort().forEach(value => {
        filter.innerHTML += `<option value="${value}">${value}</option>`;
    });
}

/* FILTER LOGIC WITH CGPA RANGE REQUIREMENT */
function applyFilters(){
    const search = searchInput.value.toLowerCase();
    const filters = {
        branch: branchFilter.value,
        backlog: backlogFilter.value,
        gender: genderFilter.value,
        dsa: dsaFilter.value,
        registered: registeredFilter.value,
        offers: offersFilter.value
    };

    const minCgpaVal = minCgpaInput.value !== "" ? parseFloat(minCgpaInput.value) : null;
    const maxCgpaVal = maxCgpaInput.value !== "" ? parseFloat(maxCgpaInput.value) : null;

    const getIdx = (text) => {
        let idx = headers.indexOf(text);
        if (idx === -1) idx = headers.findIndex(h => h.toUpperCase().includes(text.toUpperCase()));
        return idx;
    };

    const indexes = {
        branch: getIdx("Branch"),
        backlog: getIdx("No. of Backlogs"),
        gender: getIdx("Gender"),
        dsa: getIdx("DSA"),
        registered: getIdx("Registered for Placements"),
        offers: getIdx("No. of Offers"),
        cgpa: headers.indexOf("CGPA") !== -1 ? headers.indexOf("CGPA") : getIdx("CGPA")
    };

    let filtered = originalData.filter(row => {
        const rowText = row.join(" ").toLowerCase();

        /* REQUIREMENT 1: CGPA Range Logic */
        let rowCgpa = indexes.cgpa !== -1 ? parseFloat(row[indexes.cgpa]) : NaN;
        let passesCgpa = true;

        if (!isNaN(rowCgpa)) {
            if (minCgpaVal !== null && rowCgpa < minCgpaVal) passesCgpa = false;
            if (maxCgpaVal !== null && rowCgpa > maxCgpaVal) passesCgpa = false;
        } else if (minCgpaVal !== null || maxCgpaVal !== null) {
            passesCgpa = false;
        }

        return (
            rowText.includes(search) &&
            passesCgpa &&
            (indexes.branch === -1 || !filters.branch || row[indexes.branch] === filters.branch) &&
            (indexes.backlog === -1 || !filters.backlog || row[indexes.backlog] === filters.backlog) &&
            (indexes.gender === -1 || !filters.gender || row[indexes.gender] === filters.gender) &&
            (indexes.dsa === -1 || !filters.dsa || row[indexes.dsa] === filters.dsa) &&
            (indexes.registered === -1 || !filters.registered || String(row[indexes.registered]).toLowerCase().trim() === filters.registered.toLowerCase().trim()) &&
            (indexes.offers === -1 || !filters.offers || row[indexes.offers] === filters.offers)
        );
    });

    createTable(headers, filtered);
    updateStatistics(filtered);
}

/* RENDER TABLE */
function createTable(headers, rows){
    let tableHTML = "<thead><tr>";
    headers.forEach(header => {
        tableHTML += `<th>${header}</th>`;
    });
    tableHTML += "</tr></thead><tbody>";

    rows.forEach(row => {
        tableHTML += "<tr>";
        row.forEach(cell => {
            tableHTML += `<td>${cell}</td>`;
        });
        tableHTML += "</tr>";
    });
    tableHTML += "</tbody>";

    document.getElementById("dataTable").innerHTML = tableHTML;
}

/* CALCULATE STATISTICS */
function updateStatistics(data){
    const getIdx = (text) => {
        let idx = headers.indexOf(text);
        if (idx === -1) idx = headers.findIndex(h => h.toUpperCase().includes(text.toUpperCase()));
        return idx;
    };

    const indexes = {
        cgpa: headers.indexOf("CGPA") !== -1 ? headers.indexOf("CGPA") : getIdx("CGPA"),
        registered: getIdx("Registered for Placements"),
        offers: getIdx("No. of Offers")
    };

    const totalStudents = data.length;

    const placedStudents = data.filter(row => {
        if (indexes.offers === -1) return false;
        const offers = row[indexes.offers];
        return offers !== "" && offers != null && Number(offers) > 0;
    }).length;

    const totalOffers = data.reduce((sum, row) => {
        if (indexes.offers === -1) return sum;
        return sum + (Number(row[indexes.offers]) || 0);
    }, 0);

    const registeredStudents = data.filter(row => {
        if (indexes.registered === -1) return false;
        return String(row[indexes.registered]).toLowerCase().trim() === "yes";
    }).length;

    const eligibleStudents = data.filter(row => {
        if (indexes.cgpa === -1 || indexes.registered === -1) return false;
        const cgpa = parseFloat(row[indexes.cgpa]) || 0;
        const registered = String(row[indexes.registered]).toLowerCase().trim();
        return cgpa >= 6.5 && registered === "yes";
    }).length;

    document.getElementById("totalStudents").innerText = totalStudents;
    document.getElementById("placedStudents").innerText = placedStudents;
    document.getElementById("totalOffers").innerText = totalOffers;
    document.getElementById("registeredStudents").innerText = registeredStudents;
    document.getElementById("eligibleStudents").innerText = eligibleStudents;
}

function goToCGPAAnalysis(){
    window.location.href = "cgpa.html";
}
</script>

</body>
</html>
