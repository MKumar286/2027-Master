<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Placement Portal | MGIT</title>

<!-- CSV Parsing Library -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* ==========================================================================
   1. CSS VARIABLES & METRONIC/POWER-BI THEME RESET
   ========================================================================== */
:root {
    --primary: #0f2b5c;
    --primary-gradient: linear-gradient(135deg, #091e42 0%, #0f2b5c 50%, #16387c 100%);
    --accent-gold: #ffca28;
    --accent-green: #10b981;
    --accent-blue: #3b82f6;
    --accent-purple: #6366f1;
    --accent-amber: #f59e0b;
    --accent-rose: #f43f5e;
    
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --border-focus: #3b82f6;
    
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-white: #ffffff;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    
    --control-height: 34px;
    --font-sans: 'Tahoma', Geneva, Verdana, -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100vh;
    font-family: var(--font-sans);
    background-color: var(--bg-body);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* Lock main body viewport */
}

/* ==========================================================================
   2. HEADER BAR
   ========================================================================== */
.header {
    flex-shrink: 0;
    width: 100%;
    padding: 6px 16px;
    background: var(--primary-gradient);
    border-bottom: 3px solid var(--accent-gold);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    z-index: 20;
}

.header-brand h1 {
    color: var(--text-white);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.2;
}

.header-brand h2 {
    font-size: 11px;
    color: var(--accent-gold);
    font-weight: 600;
}

.header-badge {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 3px 10px;
    border-radius: 20px;
    color: #cbd5e1;
    font-size: 10.5px;
    font-weight: 500;
    backdrop-filter: blur(4px);
}

/* ==========================================================================
   3. TOP FIXED SECTION (STATS + FILTERS)
   ========================================================================== */
.top-controls {
    flex-shrink: 0;
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    z-index: 15;
}

/* ===== 8 RESPONSIVE STATS CARDS ===== */
.stats-grid {
    width: 100%;
    display: grid;
    /* Auto-fitting grid on wider screens, collapsing smoothly on lower resolutions */
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    padding: 8px 12px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--border-color);
}

.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 46px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
    overflow: hidden;
}

.stat-card:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-hover);
    border-color: #cbd5e1;
}

.stat-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--card-accent, var(--primary));
}

.stat-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--icon-bg, #f1f5f9);
    color: var(--card-accent, var(--primary));
}

.stat-icon svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
}

.stat-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
}

.stat-info .stat-label {
    font-size: 9.5px;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: uppercase;
    letter-spacing: 0.2px;
}

.stat-info .stat-value {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.1;
    margin-top: 1px;
    white-space: nowrap;
}

/* Stat Cards Variant Accents */
.stat-card.c-blue { --card-accent: #2563eb; --icon-bg: #eff6ff; }
.stat-card.c-green { --card-accent: #059669; --icon-bg: #ecfdf5; }
.stat-card.c-amber { --card-accent: #d97706; --icon-bg: #fffbeb; }
.stat-card.c-purple { --card-accent: #7c3aed; --icon-bg: #f5f3ff; }
.stat-card.c-indigo { --card-accent: #4f46e5; --icon-bg: #eef2ff; }
.stat-card.c-rose { --card-accent: #e11d48; --icon-bg: #fff1f2; }
.stat-card.c-teal { --card-accent: #0d9488; --icon-bg: #f0fdfa; }
.stat-card.c-dark { --card-accent: #0f172a; --icon-bg: #f8fafc; }

/* ===== SINGLE-ROW FIT FILTER TOOLBAR ===== */
.filter-toolbar {
    width: 100%;
    display: flex;
    flex-wrap: nowrap; /* STRICT SINGLE ROW ON DESKTOP */
    align-items: center;
    gap: 8px; /* Standard 8px gap */
    padding: 6px 12px;
    background: #0f172a;
    overflow: hidden; /* Prevents toolbar horizontal scroll */
}

/* Range input inline grouping */
.range-group {
    display: flex;
    align-items: center;
    gap: 3px;
    background: #1e293b;
    padding: 2px 4px;
    border-radius: var(--radius-sm);
    border: 1px solid #334155;
    flex: 0 1 auto;
    min-width: 0;
}

.range-group label {
    color: var(--accent-gold);
    font-size: 9.5px;
    font-weight: 700;
    white-space: nowrap;
    padding-right: 2px;
}

.range-group input {
    width: 38px;
    height: 26px;
    padding: 0 3px;
    border-radius: 3px;
    border: 1px solid #475569;
    background: #ffffff;
    color: #000000;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    outline: none;
}

.range-group span {
    color: #94a3b8;
    font-size: 10px;
    font-weight: 700;
}

/* Standardized Form Controls (Inputs & Dropdowns) */
.filter-control {
    flex: 1 1 0px; /* Equal shrink/grow distribution to fit 100% width */
    min-width: 0;  /* Allows flexbox items to compress down without overflowing */
    height: var(--control-height);
    padding: 0 6px;
    border-radius: var(--radius-sm);
    border: 1.5px solid #334155;
    background: #ffffff;
    color: #000000;
    font-family: var(--font-sans);
    font-size: 10.5px;
    font-weight: 700;
    outline: none;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.filter-control:focus {
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 2px rgba(255, 202, 40, 0.25);
}

.filter-control option {
    font-weight: 600;
    color: #0f172a;
    background-color: #ffffff;
}

/* Specific Search Box width tweaks */
input[type="text"].filter-control {
    flex: 1.2 1 0px;
}

/* Action Buttons */
.action-btn {
    height: var(--control-height);
    padding: 0 10px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.15s ease;
}

.action-btn svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
}

.reset-btn {
    background: #e11d48;
    color: #ffffff;
}

.reset-btn:hover {
    background: #be123c;
}

.export-btn {
    background: #107c41;
    color: #ffffff;
}

.export-btn:hover {
    background: #0e6b37;
}

/* ==========================================================================
   4. DATA TABLE SECTION (100% WIDTH & INDEPENDENT SCROLL)
   ========================================================================== */
.table-container {
    flex: 1;
    width: 100%;
    overflow-x: auto !important;
    overflow-y: auto !important;
    background: #ffffff;
    position: relative;
}

table {
    border-collapse: collapse;
    width: 100%;
    table-layout: auto;
    background: #ffffff;
    font-family: var(--font-sans);
}

/* Sticky Header styling */
th {
    background: #1e293b;
    color: #ffffff;
    padding: 8px 10px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
    font-size: 10.5px;
    font-weight: 700;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 2px solid #0f172a;
    border-right: 1px solid #334155;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

th:last-child {
    border-right: none;
}

/* Table Data Cells */
td {
    padding: 6px 10px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
    border-bottom: 1px solid #e2e8f0;
    border-right: 1px solid #f1f5f9;
    font-size: 10.5px;
    font-weight: 500;
    color: #000000;
    background-color: #ffffff !important;
    line-height: 1.3;
}

td:last-child {
    border-right: none;
}

/* Alternating Rows and Hover */
tr:nth-child(even) td {
    background-color: #ffffff !important;
}

tr:hover td {
    background-color: #e0f2fe !important;
    color: #0369a1;
}

/* Loading & Empty Indicators */
.status-msg {
    text-align: center;
    padding: 40px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
}

/* Scrollbar Customization */
.table-container::-webkit-scrollbar {
    height: 8px;
    width: 8px;
}

.table-container::-webkit-scrollbar-track {
    background: #f1f5f9;
}

.table-container::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

/* ==========================================================================
   5. RESPONSIVE MEDIA QUERIES
   ========================================================================== */
/* Laptop / Medium Screens (1024px to 1365px) */
@media (max-width: 1365px) {
    .stats-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* Tablet Screens (768px to 1023px) */
@media (max-width: 1023px) {
    body {
        overflow-y: auto; /* Allow natural body scroll on smaller devices */
    }

    .top-controls {
        position: relative;
    }

    .stats-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .filter-toolbar {
        flex-wrap: wrap; /* Wrap filters gracefully into multi-rows on tablet */
        gap: 6px;
    }

    .filter-control {
        flex: 1 1 calc(25% - 6px);
        min-width: 120px;
    }

    .range-group {
        flex: 1 1 100%;
        justify-content: flex-start;
    }
}

/* Mobile Screens (< 768px) */
@media (max-width: 767px) {
    .header {
        flex-direction: column;
        gap: 4px;
        text-align: center;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .filter-toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .filter-control, .action-btn {
        width: 100%;
        flex: none;
    }

    .range-group {
        width: 100%;
        justify-content: space-between;
    }
}
</style>
</head>

<body>

<!-- HEADER BRAND BAR -->
<div class="header">
    <div class="header-brand">
        <h1>Mahatma Gandhi Institute of Technology</h1>
        <h2>Training & Placement Cell</h2>
    </div>
    <div class="header-badge">Academic Year 2026 - 2027</div>
</div>

<!-- FIXED TOP CONTROLS SECTION -->
<div class="top-controls">

    <!-- 8 RESPONSIVE STATS CARDS -->
    <div class="stats-grid">
        <div class="stat-card c-blue">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Total Students</span>
                <span class="stat-value" id="totalStudents">0</span>
            </div>
        </div>

        <div class="stat-card c-green">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Registered</span>
                <span class="stat-value" id="registeredStudents">0</span>
            </div>
        </div>

        <div class="stat-card c-amber">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Eligible</span>
                <span class="stat-value" id="eligibleStudents">0</span>
            </div>
        </div>

        <div class="stat-card c-purple">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Total Placed</span>
                <span class="stat-value" id="placedStudents">0</span>
            </div>
        </div>

        <div class="stat-card c-indigo">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Total Offers</span>
                <span class="stat-value" id="totalOffers">0</span>
            </div>
        </div>

        <div class="stat-card c-teal">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Highest Package</span>
                <span class="stat-value" id="highestPackage">N/A</span>
            </div>
        </div>

        <div class="stat-card c-rose">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Avg Package</span>
                <span class="stat-value" id="avgPackage">N/A</span>
            </div>
        </div>

        <div class="stat-card c-dark">
            <div class="stat-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">Placement Rate</span>
                <span class="stat-value" id="placementRate">0%</span>
            </div>
        </div>
    </div>

    <!-- SINGLE-ROW FIT FILTER TOOLBAR -->
    <div class="filter-toolbar">
        <input type="text" id="searchInput" class="filter-control" placeholder="Search data...">
        
        <select id="branchFilter" class="filter-control"><option value="">Department</option></select>
        <select id="entranceFilter" class="filter-control"><option value="">Entrance</option></select>
        <select id="genderFilter" class="filter-control"><option value="">Gender</option></select>
        <select id="dsaFilter" class="filter-control"><option value="">DSA Training</option></select>
        <select id="registeredFilter" class="filter-control"><option value="">Registration Status</option></select>
        <select id="offersFilter" class="filter-control"><option value="">Placement Status</option></select>
        <select id="companyFilter" class="filter-control"><option value="">Company</option></select>

        <!-- Inline CGPA Range Filter -->
        <div class="range-group">
            <label>CGPA:</label>
            <input type="number" id="minCgpa" placeholder="Min" step="0.1" min="0" max="10">
            <span>-</span>
            <input type="number" id="maxCgpa" placeholder="Max" step="0.1" min="0" max="10">
        </div>

        <!-- Inline Rank Range Filter -->
        <div class="range-group">
            <label>Rank:</label>
            <input type="number" id="minRank" placeholder="Min" min="1">
            <span>-</span>
            <input type="number" id="maxRank" placeholder="Max" min="1">
        </div>

        <button class="action-btn reset-btn" onclick="resetAllFilters()" title="Reset all applied filters">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            Reset
        </button>

        <button class="action-btn export-btn" onclick="exportToExcel()" title="Export filtered data to Excel">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Excel
        </button>
    </div>

</div>

<!-- DATA TABLE SECTION -->
<div class="table-container">
    <div class="status-msg" id="loading">Loading Student Placement Data...</div>
    <table id="dataTable"></table>
</div>

<script>
/* GOOGLE SHEETS LIVE CSV LINK INTEGRATION */
const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs918b9wOBmLLA6UJDOtpHMHNuNnzxYCYUIoYd5sIXg-sEkiYZtuNKYo8vEN4d7qWTpDoOvMWq7Cxc/pub?gid=981950419&single=true&output=csv";

let originalData = [];
let headers = [];

/* CONFIGURATION OF DYNAMIC DROPDOWNS & MAPPINGS */
const filterConfigs = [
    { id: 'branchFilter', header: 'Branch', key: 'branch' },
    { id: 'entranceFilter', header: 'Entrance', key: 'entrance' },
    { id: 'genderFilter', header: 'Gender', key: 'gender' },
    { id: 'dsaFilter', header: 'DSA', key: 'dsa' },
    { id: 'registeredFilter', header: 'Registered for Placements', key: 'registered' },
    { id: 'offersFilter', header: 'No. of Offers', key: 'offers' },
    { id: 'companyFilter', header: 'Company', key: 'company' }
];

/* CSV PARSING INITIATION */
Papa.parse(csvURL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
        if (!results.data || results.data.length === 0) {
            document.getElementById("loading").innerText = "Error: No placement data found.";
            return;
        }

        headers = results.data[0];
        originalData = results.data.slice(1);

        applyFilters();

        document.getElementById("loading").style.display = "none";
    },
    error: function(err) {
        document.getElementById("loading").innerText = "Failed to load CSV source data.";
        console.error(err);
    }
});

/* DOM ELEMENTS */
const searchInput = document.getElementById("searchInput");
const minCgpaInput = document.getElementById("minCgpa");
const maxCgpaInput = document.getElementById("maxCgpa");
const minRankInput = document.getElementById("minRank");
const maxRankInput = document.getElementById("maxRank");

/* LISTENERS */
searchInput.addEventListener("input", applyFilters);
minCgpaInput.addEventListener("input", applyFilters);
maxCgpaInput.addEventListener("input", applyFilters);
minRankInput.addEventListener("input", applyFilters);
maxRankInput.addEventListener("input", applyFilters);

filterConfigs.forEach(cfg => {
    const el = document.getElementById(cfg.id);
    if (el) el.addEventListener("change", applyFilters);
});

/* ROBUST ALIAS-BASED HEADER INDEX FINDER */
function getHeaderIndex(target) {
    if (!headers || headers.length === 0) return -1;
    
    let idx = headers.findIndex(h => String(h).trim().toLowerCase() === target.trim().toLowerCase());
    if (idx !== -1) return idx;

    const aliases = {
        "Branch": ["branch", "dept", "department"],
        "Entrance": ["entrance", "entry", "exam"],
        "Gender": ["gender", "sex"],
        "DSA": ["dsa", "dsa training"],
        "Registered for Placements": ["registered for placement", "registered for placements", "registered", "placement registration"],
        "No. of Offers": ["no. of offers", "no of offers", "number of offers", "offers", "total offers"],
        "Company": ["company", "company name", "recruiter", "placed company"],
        "Salary": ["salary", "package", "ctc", "lpa"],
        "CGPA": ["cgpa", "gpa", "marks"],
        "Rank": ["rank", "eamcet rank", "ecet rank", "entrance rank"]
    };

    const targetKey = Object.keys(aliases).find(k => k.toLowerCase() === target.toLowerCase()) || target;
    const targetAliases = aliases[targetKey] || [target.toLowerCase()];

    for (let alias of targetAliases) {
        idx = headers.findIndex(h => String(h).toLowerCase().includes(alias));
        if (idx !== -1) return idx;
    }

    return -1;
}

/* CROSS-FILTERING ROW LOGIC */
function getFilteredRowsExcluding(excludeKey = null) {
    const search = searchInput.value.toLowerCase();
    
    const minCgpaVal = minCgpaInput.value !== "" ? parseFloat(minCgpaInput.value) : null;
    const maxCgpaVal = maxCgpaInput.value !== "" ? parseFloat(maxCgpaInput.value) : null;

    const minRankVal = minRankInput.value !== "" ? parseFloat(minRankInput.value) : null;
    const maxRankVal = maxRankInput.value !== "" ? parseFloat(maxRankInput.value) : null;

    const selectedValues = {};
    filterConfigs.forEach(cfg => {
        const el = document.getElementById(cfg.id);
        selectedValues[cfg.key] = el ? el.value : "";
    });

    const cgpaIdx = getHeaderIndex("CGPA");
    const rankIdx = getHeaderIndex("Rank");

    return originalData.filter(row => {
        // Search Filter
        if (search && !row.join(" ").toLowerCase().includes(search)) return false;

        // CGPA Filter
        if (cgpaIdx !== -1) {
            let rowCgpa = parseFloat(row[cgpaIdx]);
            if (!isNaN(rowCgpa)) {
                if (minCgpaVal !== null && rowCgpa < minCgpaVal) return false;
                if (maxCgpaVal !== null && rowCgpa > maxCgpaVal) return false;
            } else if (minCgpaVal !== null || maxCgpaVal !== null) {
                return false;
            }
        }

        // Rank Filter
        if (rankIdx !== -1) {
            let rawRankStr = String(row[rankIdx] || "").replace(/[^0-9.]/g, '');
            let rowRank = parseFloat(rawRankStr);
            if (!isNaN(rowRank)) {
                if (minRankVal !== null && rowRank < minRankVal) return false;
                if (maxRankVal !== null && rowRank > maxRankVal) return false;
            } else if (minRankVal !== null || maxRankVal !== null) {
                return false;
            }
        }

        // Dropdown Filters
        for (let cfg of filterConfigs) {
            if (cfg.key === excludeKey) continue;
            const val = selectedValues[cfg.key];
            if (val) {
                const colIdx = getHeaderIndex(cfg.header);
                if (colIdx !== -1) {
                    const rowVal = String(row[colIdx] || "").trim();
                    if (rowVal.toLowerCase() !== val.toLowerCase()) return false;
                }
            }
        }

        return true;
    });
}

/* DYNAMIC CASCADING DROPDOWN UPDATER */
function updateDynamicFilterDropdowns() {
    filterConfigs.forEach(cfg => {
        const selectEl = document.getElementById(cfg.id);
        if (!selectEl) return;

        const currentValue = selectEl.value;
        const colIdx = getHeaderIndex(cfg.header);

        if (colIdx === -1) {
            selectEl.innerHTML = `<option value="">${cfg.header} (N/A)</option>`;
            return;
        }

        const matchingRows = getFilteredRowsExcluding(cfg.key);

        let uniqueVals = [...new Set(matchingRows.map(r => String(r[colIdx] || "").trim()))]
            .filter(v => v !== undefined && v !== null && v !== "");

        if (currentValue && !uniqueVals.some(v => v.toLowerCase() === currentValue.toLowerCase())) {
            uniqueVals.push(currentValue);
        }

        uniqueVals.sort((a, b) => {
            const numA = Number(a), numB = Number(b);
            if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
            return a.localeCompare(b);
        });

        const actualHeaderName = headers[colIdx] || cfg.header;
        let optionsHTML = `<option value="">${actualHeaderName}</option>`;
        uniqueVals.forEach(val => {
            const isSelected = (val.toLowerCase() === currentValue.toLowerCase()) ? "selected" : "";
            optionsHTML += `<option value="${val}" ${isSelected}>${val}</option>`;
        });

        selectEl.innerHTML = optionsHTML;
    });
}

/* APPLY FILTERS & RE-RENDER */
function applyFilters(){
    updateDynamicFilterDropdowns();
    const filtered = getFilteredRowsExcluding(null);
    createTable(headers, filtered);
    updateStatistics(filtered);
}

/* RESET ALL FILTERS */
function resetAllFilters(){
    searchInput.value = "";
    minCgpaInput.value = "";
    maxCgpaInput.value = "";
    minRankInput.value = "";
    maxRankInput.value = "";
    
    filterConfigs.forEach(cfg => {
        const el = document.getElementById(cfg.id);
        if (el) el.value = "";
    });

    applyFilters();
}

/* EXPORT TO EXCEL LOGIC (WITH UTF-8 BOM PRESERVATION) */
function exportToExcel(){
    const filtered = getFilteredRowsExcluding(null);
    if (!filtered || filtered.length === 0) {
        alert("No filtered data available to export.");
        return;
    }

    let csvLines = [];
    let headerRow = headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(",");
    csvLines.push(headerRow);

    filtered.forEach(row => {
        let rowData = row.map(cell => {
            let cellText = (cell !== undefined && cell !== null) ? String(cell).replace(/"/g, '""') : "";
            return `"${cellText}"`;
        });
        csvLines.push(rowData.join(","));
    });

    let csvContent = csvLines.join("\r\n");

    const BOM = "\uFEFF";
    const blob = new Blob([BOM + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", "Student_Placement_Data.csv");
    document.body.appendChild(link);
    link.click();
    
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

/* DYNAMIC TABLE GENERATION */
function createTable(headers, rows){
    if (rows.length === 0) {
        document.getElementById("dataTable").innerHTML = `
            <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
            <tbody><tr><td colspan="${headers.length}" style="padding:30px; color:#64748b; font-weight:600;">No records found matching applied criteria.</td></tr></tbody>
        `;
        return;
    }

    let tableHTML = "<thead><tr>";
    headers.forEach(header => {
        tableHTML += `<th>${header}</th>`;
    });
    tableHTML += "</tr></thead><tbody>";

    rows.forEach(row => {
        tableHTML += "<tr>";
        row.forEach(cell => {
            tableHTML += `<td>${cell !== undefined && cell !== null ? cell : ""}</td>`;
        });
        tableHTML += "</tr>";
    });
    tableHTML += "</tbody>";

    document.getElementById("dataTable").innerHTML = tableHTML;
}

/* STATISTICAL METRICS CALCULATION */
function updateStatistics(data){
    const cgpaIdx = getHeaderIndex("CGPA");
    const offersIdx = getHeaderIndex("No. of Offers");
    const registeredIdx = getHeaderIndex("Registered for Placements");
    const salaryIdx = getHeaderIndex("Salary");

    // Total Students
    const totalStudents = data.length;

    // Registered Students Count
    const registeredCount = data.filter(row => {
        if (registeredIdx === -1) return true;
        const val = String(row[registeredIdx] || "").trim().toLowerCase();
        return val === "yes" || val === "registered" || val === "1";
    }).length;

    // Eligible Students
    const eligibleStudents = data.filter(row => {
        if (cgpaIdx === -1) return false;
        const val = parseFloat(row[cgpaIdx]);
        return !isNaN(val) && isFinite(val);
    }).length;

    // Placed Students
    const placedStudents = data.filter(row => {
        if (offersIdx === -1) return false;
        const val = parseFloat(row[offersIdx]);
        return !isNaN(val) && isFinite(val) && val > 0;
    }).length;

    // Total Offers Sum
    const totalOffers = data.reduce((sum, row) => {
        if (offersIdx === -1) return sum;
        const val = parseFloat(row[offersIdx]);
        return sum + (!isNaN(val) && isFinite(val) ? val : 0);
    }, 0);

    // Salary Computations
    let maxSalary = 0;
    let totalSalary = 0;
    let salaryCount = 0;

    if (salaryIdx !== -1) {
        data.forEach(row => {
            let rawSal = String(row[salaryIdx] || "").replace(/[^0-9.]/g, '');
            let salVal = parseFloat(rawSal);
            if (!isNaN(salVal) && salVal > 0) {
                if (salVal > maxSalary) maxSalary = salVal;
                totalSalary += salVal;
                salaryCount++;
            }
        });
    }

    // Placement Rate Calculation
    const rate = totalStudents > 0 ? ((placedStudents / totalStudents) * 100).toFixed(1) + "%" : "0%";

    // DOM Updates
    document.getElementById("totalStudents").innerText = totalStudents;
    document.getElementById("registeredStudents").innerText = registeredCount;
    document.getElementById("eligibleStudents").innerText = eligibleStudents;
    document.getElementById("placedStudents").innerText = placedStudents;
    document.getElementById("totalOffers").innerText = totalOffers;
    document.getElementById("highestPackage").innerText = maxSalary > 0 ? maxSalary + " LPA" : "N/A";
    document.getElementById("avgPackage").innerText = salaryCount > 0 ? (totalSalary / salaryCount).toFixed(2) + " LPA" : "N/A";
    document.getElementById("placementRate").innerText = rate;
}
</script>
