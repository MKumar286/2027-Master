<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Placement Portal | MGIT</title>

<!-- CSV Parsing Library -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* ===== GLOBAL RESET & FULL-VIEWPORT LOCK ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100vh;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    background-color: #ffffff;
    color: #0f172a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ===== TOP CONTROLS WRAPPER ===== */
.top-controls {
    flex-shrink: 0;
    width: 100%;
    background: #ffffff;
    z-index: 10;
    margin: 0;
    padding: 0;
}

/* ===== CENTERED HEADER ===== */
.header {
    width: 100%;
    padding: 10px 15px;
    background: linear-gradient(135deg, #091e42 0%, #0f2b5c 50%, #16387c 100%);
    border-bottom: 3px solid #ffca28;
    text-align: center;
    margin: 0;
}

.header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
}

.header h1 {
    color: #ffffff;
    font-size: 19px;
    text-transform: none;
    letter-spacing: 0.3px;
    font-weight: 700;
    margin: 0;
}

.header h2 {
    font-size: 12px;
    color: #ffca28;
    font-weight: 600;
    text-transform: none;
    margin-top: 2px;
}

.header h3 {
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 400;
    text-transform: none;
    margin-top: 1px;
}

/* ===== MAIN SECTION WRAPPER ===== */
.main-wrapper {
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
}

/* ===== METRIC CARDS & CGPA RANGE BOX ===== */
.cards-container {
    width: 100%;
    display: grid;
    grid-template-columns: 1.1fr repeat(5, 1fr);
    gap: 0;
    margin: 0;
    padding: 0;
}

.card {
    padding: 6px 8px;
    border-radius: 0;
    color: white;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    position: relative;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
}

.card:last-child {
    border-right: none;
}

.cgpa-filter-card {
    background: linear-gradient(135deg, #0b192c 0%, #1e293b 100%);
    border-left: 4px solid #ffca28;
}

.cgpa-filter-card h3 {
    color: #ffca28;
    margin-bottom: 2px;
}

.cgpa-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-top: 1px;
}

.cgpa-inputs input {
    width: 42%;
    padding: 2px 4px;
    border-radius: 3px;
    border: 1px solid #ffca28;
    background: #ffffff;
    color: #0f172a;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    outline: none;
}

.cgpa-inputs input:focus {
    border-color: #00e676;
    box-shadow: 0 0 4px rgba(0, 230, 118, 0.6);
}

.cgpa-inputs span {
    color: #ffffff;
    font-weight: 700;
    font-size: 11px;
}

.card:nth-child(2) { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
.card:nth-child(3) { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
.card:nth-child(4) { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); }
.card:nth-child(5) { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); }
.card:nth-child(6) { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }

.card h3 {
    margin: 0;
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
    text-transform: none;
}

.card p {
    margin-top: 1px;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
}

/* ===== SINGLE ROW FILTER TOOLBAR ===== */
.filter-container {
    width: 100%;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 4px;
    background: #0f172a;
    padding: 5px 6px;
    border-radius: 0;
    border: none;
    margin: 0;
    overflow-x: hidden;
}

.filter-container input[type="text"] {
    flex: 1.2;
    min-width: 100px;
    padding: 5px 6px;
    border-radius: 3px;
    border: 1px solid #334155;
    background: #ffffff;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #1e293b;
    outline: none;
}

.filter-container select {
    flex: 1;
    min-width: 80px;
    padding: 5px 3px;
    border-radius: 3px;
    border: 1px solid #334155;
    background: #ffffff;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #1e293b;
    outline: none;
    text-overflow: ellipsis;
}

.filter-container input:focus,
.filter-container select:focus {
    border-color: #ff6600;
}

.action-btn {
    padding: 5px 8px;
    border: none;
    border-radius: 3px;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.2s ease, transform 0.1s ease;
}

.action-btn:active {
    transform: scale(0.97);
}

.reset-btn {
    background: #e11d48;
    color: #ffffff;
}

.reset-btn:hover {
    background: #be123c;
}

.export-btn {
    background: #107c41;
    color: #ffffff;
}

.export-btn:hover {
    background: #0e6b37;
}

/* ===== TABLE CONTAINER & COMPACT SCREEN-FITTING TABLE ===== */
.table-container {
    flex-grow: 1;
    width: 100%;
    overflow-x: auto !important;
    overflow-y: auto !important;
    padding: 0;
    margin: 0;
    background: #ffffff;
}

table {
    border-collapse: collapse;
    width: 100%;
    table-layout: auto; /* Dynamically fits columns based on available content */
    background: #ffffff;
    border: none;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
}

th {
    background: #1e293b;
    color: #ffffff;
    padding: 6px 8px; /* Reduced extra space */
    text-align: center;
    white-space: normal; /* Allows text wrapping to fit on screen */
    word-break: break-word;
    position: sticky;
    top: 0;
    z-index: 2;
    font-size: 11px;
    font-weight: 700;
    text-transform: none;
    border-bottom: 2px solid #0f172a;
    border-right: 1px solid #334155;
    line-height: 1.25;
}

th:last-child {
    border-right: none;
}

td {
    padding: 5px 6px; /* Compact padding around data cells */
    text-align: center;
    white-space: normal; /* Smart wrapping prevents wide stretched columns */
    word-break: break-word;
    border-bottom: 1px solid #e2e8f0;
    border-right: 1px solid #f1f5f9;
    font-size: 11px;
    color: #334155;
    font-weight: 500;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
    line-height: 1.25;
    transition: background-color 0.15s ease, color 0.15s ease;
}

td:last-child {
    border-right: none;
}

tr:nth-child(even) td {
    background: #f8fafc;
}

tr:hover td {
    background: #e0f2fe;
    color: #0369a1;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 14px;
    font-weight: 600;
    color: #1e293b;
    font-family: 'Tahoma', Geneva, Verdana, sans-serif;
}

/* SOLID ORANGE HORIZONTAL SCROLLBAR */
.table-container::-webkit-scrollbar {
    height: 10px;
    width: 8px;
}

.table-container::-webkit-scrollbar-track {
    background: #fff0e6;
    border-top: 1px solid #ffd6cc;
}

.table-container::-webkit-scrollbar-thumb {
    background: #ff6600;
    border-radius: 4px;
    border: 2px solid #fff0e6;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: #e65c00;
}
</style>
</head>

<body>

<div class="top-controls">

    <!-- CENTERED HEADER -->
    <div class="header">
        <div class="header-brand">
            <h1>Mahatma Gandhi Institute of Technology</h1>
            <h2>Training & Placement Cell</h2>
            <h3>Academic Year 2026 - 2027</h3>
        </div>
    </div>

    <div class="main-wrapper">
        <!-- METRIC CARDS SECTION WITH CGPA RANGE FILTER BOX -->
        <div class="cards-container">
            <div class="card cgpa-filter-card">
                <h3>CGPA Range Filter</h3>
                <div class="cgpa-inputs">
                    <input type="number" id="minCgpa" placeholder="Min" step="0.1" min="0" max="10">
                    <span>-</span>
                    <input type="number" id="maxCgpa" placeholder="Max" step="0.1" min="0" max="10">
                </div>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>
            <div class="card">
                <h3>Registered for Placements</h3>
                <p id="registeredStudents">0</p>
            </div>
            <div class="card">
                <h3>Eligible Students</h3>
                <p id="eligibleStudents">0</p>
            </div>
            <div class="card">
                <h3>Total Students Placed</h3>
                <p id="placedStudents">0</p>
            </div>
            <div class="card">
                <h3>Total Offers</h3>
                <p id="totalOffers">0</p>
            </div>
        </div>

        <!-- SINGLE-ROW FILTER TOOLBAR -->
        <div class="filter-container">
            <input type="text" id="searchInput" placeholder="Search data...">
            <select id="branchFilter"><option value="">Branch</option></select>
            <select id="backlogFilter"><option value="">No. of Backlogs</option></select>
            <select id="genderFilter"><option value="">Gender</option></select>
            <select id="dsaFilter"><option value="">DSA Training</option></select>
            <select id="registeredFilter"><option value="">Registered for Placements</option></select>
            <select id="offersFilter"><option value="">No. of Offers</option></select>
            
            <!-- RESET FILTERS & EXCEL EXPORT BUTTONS -->
            <button class="action-btn reset-btn" onclick="resetAllFilters()" title="Reset all applied filters">Reset Filters</button>
            <button class="action-btn export-btn" onclick="exportToExcel()" title="Export filtered rows to Excel">Export Excel</button>
        </div>
    </div>

</div>

<!-- DATA TABLE SECTION -->
<div class="table-container">
    <div class="loading" id="loading">Loading Student Placement Data...</div>
    <table id="dataTable"></table>
</div>

<script>
/* DIRECT GOOGLE SHEET CSV LINK INTEGRATION */
const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs918b9wOBmLLA6UJDOtpHMHNuNnzxYCYUIoYd5sIXg-sEkiYZtuNKYo8vEN4d7qWTpDoOvMWq7Cxc/pub?gid=981950419&single=true&output=csv";

let originalData = [];
let headers = [];

Papa.parse(csvURL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
        if (!results.data || results.data.length === 0) {
            document.getElementById("loading").innerText = "Error: No data found in CSV.";
            return;
        }

        // Dynamically reads exact headers directly from Google Sheet
        headers = results.data[0];
        originalData = results.data.slice(1);

        populateFilters(originalData);
        applyFilters();

        document.getElementById("loading").style.display = "none";
    },
    error: function(err) {
        document.getElementById("loading").innerText = "Error loading CSV file.";
        console.error(err);
    }
});

/* FILTER ELEMENTS */
const searchInput = document.getElementById("searchInput");
const branchFilter = document.getElementById("branchFilter");
const backlogFilter = document.getElementById("backlogFilter");
const genderFilter = document.getElementById("genderFilter");
const dsaFilter = document.getElementById("dsaFilter");
const registeredFilter = document.getElementById("registeredFilter");
const offersFilter = document.getElementById("offersFilter");
const minCgpaInput = document.getElementById("minCgpa");
const maxCgpaInput = document.getElementById("maxCgpa");

/* EVENT LISTENERS */
searchInput.addEventListener("input", applyFilters);
branchFilter.addEventListener("change", applyFilters);
backlogFilter.addEventListener("change", applyFilters);
genderFilter.addEventListener("change", applyFilters);
dsaFilter.addEventListener("change", applyFilters);
registeredFilter.addEventListener("change", applyFilters);
offersFilter.addEventListener("change", applyFilters);
minCgpaInput.addEventListener("input", applyFilters);
maxCgpaInput.addEventListener("input", applyFilters);

/* DYNAMICALLY POPULATE DROPDOWNS BASED ON GOOGLE SHEET HEADERS */
function populateFilters(data){
    fillFilter(branchFilter, "Branch", data);
    fillFilter(backlogFilter, "No. of Backlogs", data);
    fillFilter(genderFilter, "Gender", data);
    fillFilter(dsaFilter, "DSA", data);
    fillFilter(registeredFilter, "Registered for Placements", data);
    fillFilter(offersFilter, "No. of Offers", data);
}

function fillFilter(filter, column, data){
    let index = headers.indexOf(column);
    if (index === -1) {
        index = headers.findIndex(h => h.toUpperCase().includes(column.toUpperCase()));
    }
    
    if(index === -1) {
        filter.innerHTML = `<option value="">${column} (N/A)</option>`;
        return; 
    }

    // Match exact dynamic column title from Google Sheet
    const dynamicHeaderName = headers[index];

    let values = [...new Set(data.map(row => row[index]))];
    values = values.filter(v => v !== undefined && v !== null && String(v).trim() !== "");

    filter.innerHTML = `<option value="">${dynamicHeaderName}</option>`;

    values.sort().forEach(value => {
        filter.innerHTML += `<option value="${value}">${value}</option>`;
    });
}

/* FILTER LOGIC */
function applyFilters(){
    const search = searchInput.value.toLowerCase();
    const filters = {
        branch: branchFilter.value,
        backlog: backlogFilter.value,
        gender: genderFilter.value,
        dsa: dsaFilter.value,
        registered: registeredFilter.value,
        offers: offersFilter.value
    };

    const minCgpaVal = minCgpaInput.value !== "" ? parseFloat(minCgpaInput.value) : null;
    const maxCgpaVal = maxCgpaInput.value !== "" ? parseFloat(maxCgpaInput.value) : null;

    const getIdx = (text) => {
        let idx = headers.indexOf(text);
        if (idx === -1) idx = headers.findIndex(h => h.toUpperCase().includes(text.toUpperCase()));
        return idx;
    };

    const indexes = {
        branch: getIdx("Branch"),
        backlog: getIdx("No. of Backlogs"),
        gender: getIdx("Gender"),
        dsa: getIdx("DSA"),
        registered: getIdx("Registered for Placements"),
        offers: getIdx("No. of Offers"),
        cgpa: headers.indexOf("CGPA") !== -1 ? headers.indexOf("CGPA") : getIdx("CGPA")
    };

    let filtered = originalData.filter(row => {
        const rowText = row.join(" ").toLowerCase();

        let rowCgpa = indexes.cgpa !== -1 ? parseFloat(row[indexes.cgpa]) : NaN;
        let passesCgpa = true;

        if (!isNaN(rowCgpa)) {
            if (minCgpaVal !== null && rowCgpa < minCgpaVal) passesCgpa = false;
            if (maxCgpaVal !== null && rowCgpa > maxCgpaVal) passesCgpa = false;
        } else if (minCgpaVal !== null || maxCgpaVal !== null) {
            passesCgpa = false;
        }

        return (
            rowText.includes(search) &&
            passesCgpa &&
            (indexes.branch === -1 || !filters.branch || row[indexes.branch] === filters.branch) &&
            (indexes.backlog === -1 || !filters.backlog || row[indexes.backlog] === filters.backlog) &&
            (indexes.gender === -1 || !filters.gender || row[indexes.gender] === filters.gender) &&
            (indexes.dsa === -1 || !filters.dsa || row[indexes.dsa] === filters.dsa) &&
            (indexes.registered === -1 || !filters.registered || String(row[indexes.registered]).toLowerCase().trim() === filters.registered.toLowerCase().trim()) &&
            (indexes.offers === -1 || !filters.offers || row[indexes.offers] === filters.offers)
        );
    });

    createTable(headers, filtered);
    updateStatistics(filtered);
}

/* RESET ALL FILTERS LOGIC */
function resetAllFilters(){
    searchInput.value = "";
    branchFilter.value = "";
    backlogFilter.value = "";
    genderFilter.value = "";
    dsaFilter.value = "";
    registeredFilter.value = "";
    offersFilter.value = "";
    minCgpaInput.value = "";
    maxCgpaInput.value = "";
    applyFilters();
}

/* EXPORT TO EXCEL LOGIC */
function exportToExcel(){
    const table = document.getElementById("dataTable");
    if (!table || table.rows.length <= 1) {
        alert("No filtered data available to export.");
        return;
    }

    let csvContent = "";
    for (let i = 0; i < table.rows.length; i++) {
        let row = table.rows[i];
        let rowData = [];
        for (let j = 0; j < row.cells.length; j++) {
            let cellText = row.cells[j].innerText.replace(/"/g, '""');
            rowData.push(`"${cellText}"`);
        }
        csvContent += rowData.join(",") + "\n";
    }

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", "Student_Placement_Data.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

/* DYNAMIC TABLE GENERATION EXACTLY AS IN GOOGLE SHEET */
function createTable(headers, rows){
    let tableHTML = "<thead><tr>";
    headers.forEach(header => {
        tableHTML += `<th>${header}</th>`;
    });
    tableHTML += "</tr></thead><tbody>";

    rows.forEach(row => {
        tableHTML += "<tr>";
        row.forEach(cell => {
            tableHTML += `<td>${cell}</td>`;
        });
        tableHTML += "</tr>";
    });
    tableHTML += "</tbody>";

    document.getElementById("dataTable").innerHTML = tableHTML;
}

/* CALCULATE STATISTICS */
function updateStatistics(data){
    const getIdx = (text) => {
        let idx = headers.indexOf(text);
        if (idx === -1) idx = headers.findIndex(h => h.toUpperCase().includes(text.toUpperCase()));
        return idx;
    };

    const indexes = {
        cgpa: headers.indexOf("CGPA") !== -1 ? headers.indexOf("CGPA") : getIdx("CGPA"),
        registered: getIdx("Registered for Placements"),
        offers: getIdx("No. of Offers")
    };

    const totalStudents = data.length;

    const placedStudents = data.filter(row => {
        if (indexes.offers === -1) return false;
        const offers = row[indexes.offers];
        return offers !== "" && offers != null && Number(offers) > 0;
    }).length;

    const totalOffers = data.reduce((sum, row) => {
        if (indexes.offers === -1) return sum;
        return sum + (Number(row[indexes.offers]) || 0);
    }, 0);

    const registeredStudents = data.filter(row => {
        if (indexes.registered === -1) return false;
        return String(row[indexes.registered]).toLowerCase().trim() === "yes";
    }).length;

    const eligibleStudents = data.filter(row => {
        if (indexes.cgpa === -1 || indexes.registered === -1) return false;
        const cgpa = parseFloat(row[indexes.cgpa]) || 0;
        const registered = String(row[indexes.registered]).toLowerCase().trim();
        return cgpa >= 6.5 && registered === "yes";
    }).length;

    document.getElementById("totalStudents").innerText = totalStudents;
    document.getElementById("placedStudents").innerText = placedStudents;
    document.getElementById("totalOffers").innerText = totalOffers;
    document.getElementById("registeredStudents").innerText = registeredStudents;
    document.getElementById("eligibleStudents").innerText = eligibleStudents;
}
</script>

</body>
</html>
